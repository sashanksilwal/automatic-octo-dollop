plugins { id 'com.android.application' }
android {
    namespace 'edu.purdue.cs536.phone'
    compileSdk 35
    defaultConfig {
        applicationId 'edu.purdue.cs536.phone'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        testInstrumentationRunner 'edu.purdue.cs536.phone.RelayLifecycleInstrumentation'
        manifestPlaceholders = [appLabel: project.hasProperty('cs536ApplicationIdSuffix') ? 'CS536 Receiver Live Test' : 'CS536 Receiver']
    }
    buildTypes {
        debug { applicationIdSuffix (project.findProperty('cs536ApplicationIdSuffix') ?: '') }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies { implementation project(':android-common') }
